<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VEYRA Admin</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="logo" href="/">VEYRA Admin</a><a href="/">Store</a></header><main style="padding:40px 6%"><div id="login"><h1>Admin dashboard</h1><p>Use the admin username/password configured on the server.</p><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button class="btn" onclick="enter()">Enter</button></div><div id="dash" style="display:none"><h2>Products</h2><form id="productForm" class="form" style="max-width:600px"><input name="name" placeholder="Product name" required><input name="price" type="number" step="1" placeholder="Price in INR" required><input name="category" placeholder="Category" required><input name="tag" placeholder="Tag"><input name="image_url" placeholder="Image URL"><textarea name="description" placeholder="Description"></textarea><input name="stock" type="number" placeholder="Stock" required><button class="btn">Add product</button></form><div id="products"></div><h2>Orders</h2><div id="orders"></div></div></main><script>let auth='';const api=async(u,o={})=>{o.headers={...(o.headers||{}),Authorization:'Basic '+auth,'Content-Type':'application/json'};const r=await fetch(u,o),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Error');return d};async function enter(){auth=btoa(document.getElementById('u').value+':'+document.getElementById('p').value);try{await api('/api/admin/orders');document.getElementById('login').style.display='none';document.getElementById('dash').style.display='block';load()}catch(e){alert(e.message)}}async function load(){const p=await fetch('/api/products').then(r=>r.json());document.getElementById('products').innerHTML=p.map(x=>'<div class="productInfo" style="background:white;margin:10px 0;padding:15px"><b>'+x.name+'</b> · ₹'+(x.price_paise/100)+' · Stock '+x.stock+' <button onclick="del('+x.id+')">Hide</button></div>').join('');const o=await api('/api/admin/orders');document.getElementById('orders').innerHTML=o.map(x=>'<div style="background:white;border:1px solid #eee;padding:15px;margin:10px 0"><b>'+x.order_number+'</b> · ₹'+(x.amount_paise/100)+' · '+x.payment_status+' · <select onchange="status('+x.id+',this.value)"><option>'+x.order_status+'</option><option>confirmed</option><option>shipped</option><option>delivered</option><option>cancelled</option></select><br>'+x.customer_name+' · '+x.phone+' · '+x.address+'</div>').join('')}document.getElementById('productForm').onsubmit=async e=>{e.preventDefault();await api('/api/admin/products',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});e.target.reset();load()};async function del(id){await api('/api/admin/products/'+id,{method:'DELETE'});load()}async function status(id,status){await api('/api/admin/orders/'+id,{method:'PATCH',body:JSON.stringify({status})});load()}</script></body></html>
